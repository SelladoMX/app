name: Build Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  POETRY_VERSION: '2.1.4'

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Here rather than in a build job, so a mismatched tag fails before any
      # build uploads to the release
      - name: Check tag matches __version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/selladomx/__init__.py)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ $version"
            exit 1
          fi

      - name: Set up Python 3.13
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: .venv
          key: test-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Install system dependencies for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            libxcb-shape0 \
            libegl1 \
            libdbus-1-3 \
            libfontconfig1

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: poetry run pytest -v --tb=short -m "not network"

      - name: Run linter (optional)
        run: poetry run black --check src/ || true
        continue-on-error: true

  test-windows:
    name: Run tests (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Poetry
        shell: pwsh
        run: |
          pip install "poetry==${{ env.POETRY_VERSION }}"
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: .venv
          key: test-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: poetry run pytest -v --tb=short -m "not network"

  network-tests:
    name: Run network tests (non-blocking)
    # Public TSAs can be down or slow; their failures must not block a release.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: .venv
          key: test-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Install system dependencies for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            libxcb-shape0 \
            libegl1 \
            libdbus-1-3 \
            libfontconfig1

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: poetry run pytest -v --tb=short -m network

  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [test, test-windows]
    permissions:
      contents: write       # Required to create releases
      id-token: write       # Required for Sigstore OIDC (attestations)
      attestations: write   # Required to persist attestations
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact_name: SelladoMX-Windows
            artifact_file: SelladoMX-Windows.zip
          - os: macos-latest
            platform: macos
            artifact_name: SelladoMX-macOS
            artifact_file: SelladoMX-macOS.dmg

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Poetry (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pip install "poetry==${{ env.POETRY_VERSION }}"
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true
          echo "Poetry installed via pip"
          poetry --version

      - name: Install Poetry (Unix)
        if: runner.os != 'Windows'
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: .venv
          key: ${{ matrix.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: |
          poetry install --with dev

      - name: Build with PyInstaller
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          poetry run pyinstaller selladomx.spec

      - name: Build installer (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path src/selladomx/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
            if ($tagVersion -ne $version) {
              Write-Error "Tag $env:GITHUB_REF_NAME does not match __version__ $version"
              exit 1
            }
            $version = $tagVersion
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --version=6.7.1 -y --no-progress
          }
          & $iscc "/DAppVersion=$version" installer\selladomx.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Add README to Windows build
        if: matrix.platform == 'windows'
        run: |
          copy assets\README-Windows.txt dist\selladomx\README.txt
        shell: cmd

      - name: Create archive (Windows)
        if: matrix.platform == 'windows'
        run: |
          cd dist
          7z a -tzip ${{ matrix.artifact_name }}.zip selladomx
        shell: bash

      - name: Create DMG (macOS)
        if: matrix.platform == 'macos'
        run: |
          brew install create-dmg

          create-dmg \
            --volname "SelladoMX" \
            --volicon "dist/SelladoMX.app/Contents/Resources/selladomx.icns" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "SelladoMX.app" 200 190 \
            --hide-extension "SelladoMX.app" \
            --app-drop-link 600 185 \
            "dist/${{ matrix.artifact_file }}" \
            "dist/SelladoMX.app" \
            || true  # create-dmg can fail but still create the dmg

          # If create-dmg failed, create a simple dmg
          if [ ! -f "dist/${{ matrix.artifact_file }}" ]; then
            hdiutil create -volname "SelladoMX" -srcfolder "dist/SelladoMX.app" -ov -format UDZO "dist/${{ matrix.artifact_file }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_file }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/${{ matrix.artifact_file }}

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            dist/${{ matrix.artifact_file }}
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Upload installer artifact (Windows)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: SelladoMX-Windows-Setup
          path: dist/SelladoMX-Windows-Setup.exe

      - name: Attest installer build provenance (Windows)
        if: matrix.platform == 'windows'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/SelladoMX-Windows-Setup.exe

      - name: Upload installer to Release (Windows)
        if: matrix.platform == 'windows' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: dist/SelladoMX-Windows-Setup.exe

  build-flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    needs: [test, test-windows]
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Must match the Python of the Flatpak runtime (KDE 6.11 / Freedesktop
      # 25.08), since pip downloads wheels for the running interpreter
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: ${{ env.POETRY_VERSION }}

      - name: Export dependencies and download wheels
        run: |
          poetry self add "poetry-plugin-export==1.10.1"

          # Export from poetry.lock (single source of truth). The hashes are
          # also checked by the pip install inside the Flatpak build.
          poetry export -f requirements.txt --output requirements.txt

          # Download all wheels for offline Flatpak build
          mkdir -p flatpak-python-deps
          pip download --require-hashes --only-binary=:all: -r requirements.txt -d flatpak-python-deps

          # Build our app wheel (so flatpak doesn't need poetry-core)
          poetry build
          cp dist/*.whl flatpak-python-deps/

      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub org.kde.Platform//6.11 org.kde.Sdk//6.11

      - name: Cache Flatpak build directory
        uses: actions/cache@v6
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ hashFiles('com.selladomx.SelladoMX.yml', 'poetry.lock') }}
          restore-keys: |
            flatpak-builder-

      - name: Build Flatpak
        run: |
          flatpak-builder --force-clean --repo=repo --ccache build-dir com.selladomx.SelladoMX.yml

      - name: Export Flatpak bundle
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF_NAME#v}
          else
            VERSION="dev"
          fi

          flatpak build-bundle repo \
            SelladoMX-${VERSION}.flatpak \
            com.selladomx.SelladoMX \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: SelladoMX-Flatpak
          path: SelladoMX-*.flatpak

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: SelladoMX-*.flatpak

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: SelladoMX-*.flatpak

  checksums:
    name: Generate checksums
    runs-on: ubuntu-latest
    needs: [build, build-flatpak]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.flatpak" -o -name "*.zip" -o -name "*.dmg" -o -name "*.exe" \) \
            -exec sha256sum {} \; | sed 's|  \./[^/]*/|  |' > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: Attest checksums
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: SHA256SUMS.txt

      - name: Upload checksums to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: SHA256SUMS.txt
